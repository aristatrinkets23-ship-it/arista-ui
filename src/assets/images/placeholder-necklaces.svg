<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="neckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE8"/>
      <stop offset="100%" stop-color="#E8E3F3"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C396"/>
      <stop offset="50%" stop-color="#CFA874"/>
      <stop offset="100%" stop-color="#A88250"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#neckBg)"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#CFA874" stroke-width="1" opacity="0.3"/>
  <!-- Necklace Chain -->
  <path d="M 100 110 Q 200 280 300 110" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 3"/>
  <!-- Pendant -->
  <circle cx="200" cy="205" r="5" fill="#CFA874"/>
  <polygon points="200,210 218,235 200,270 182,235" fill="url(#goldGrad)" stroke="#5B4636" stroke-width="1"/>
  <circle cx="200" cy="240" r="6" fill="#F7E9E6"/>
  <!-- Text -->
  <text x="200" y="325" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="600" fill="#5B4636" text-anchor="middle" letter-spacing="2">FINE NECKLACES</text>
  <text x="200" y="345" font-family="'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#CFA874" text-anchor="middle" letter-spacing="1.5">ARISTA FINE JEWELLERY</text>
</svg>
