  <ellipse cx="200" cy="190" rx="90" ry="50" fill="none" stroke="url(#goldGrad)" stroke-width="16"/>
  <ellipse cx="200" cy="190" rx="90" ry="50" fill="none" stroke="#5B4636" stroke-width="1.5" opacity="0.3"/>
  <!-- Diamond Accents -->
  <polygon points="140,190 148,182 156,190 148,198" fill="#FFFFFF" stroke="#CFA874" stroke-width="1"/>
  <polygon points="200,240 208,232 216,240 208,248" fill="#FFFFFF" stroke="#CFA874" stroke-width="1"/>
  <polygon points="260,190 268,182 276,190 268,198" fill="#FFFFFF" stroke="#CFA874" stroke-width="1"/>
  <!-- Text -->
  <text x="200" y="325" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="600" fill="#5B4636" text-anchor="middle" letter-spacing="2">LUXURY BRACELETS</text>
  <text x="200" y="345" font-family="'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#CFA874" text-anchor="middle" letter-spacing="1.5">ARISTA FINE JEWELLERY</text>
